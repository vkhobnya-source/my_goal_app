<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goals and Tasks Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Language switcher -->
    <div class="lang-switcher">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="ru">RU</button>
    </div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-box">
            <h1 data-i18n="auth.heading">🎯 Goals Tracker</h1>
            <form id="auth-form">
                <input type="email" id="auth-email" data-i18n-placeholder="auth.email" placeholder="Email..." required>
                <input type="password" id="auth-password" data-i18n-placeholder="auth.password" placeholder="Password..." required>
                <button type="submit" id="auth-submit-btn">Sign In</button>
            </form>
            <button type="button" id="toggle-auth-btn" class="toggle-btn">No account? Sign Up</button>
            <div id="auth-error" class="error-message" style="display:none;"></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app-screen" class="container" style="display: none;">
        <!-- Left panel: Goals -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2 data-i18n="app.myGoals">🎯 My Goals</h2>
                <div class="sidebar-header-actions">
                    <button type="button" id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle theme">&#x1F319;</button>
                    <button type="button" id="logout-btn" class="logout-btn" data-i18n="app.signOut">Sign Out</button>
                </div>
            </div>
            <form id="goal-form">
                <input type="text" id="goal-title" data-i18n-placeholder="goal.title" placeholder="Goal name..." required>
                <textarea id="goal-desc" data-i18n-placeholder="goal.description" placeholder="Description..."></textarea>
                <button type="submit" data-i18n="goal.add">Add goal</button>
            </form>
            <div id="goal-error" class="form-error" style="display:none;"></div>
            <div id="goals-list" class="goals-list"></div>
        </div>

        <!-- Right panel: Tasks -->
        <div class="main-content">
            <div id="no-selection" class="placeholder">
                <h3 data-i18n="placeholder.selectGoal">Select a goal on the left to manage its tasks.</h3>
            </div>
            <div id="tasks-container" class="tasks-container" style="display: none;">
                <div class="tasks-header">
                    <h2 id="selected-goal-title">📝 Tasks</h2>
                    <button type="button" id="analyze-goal-button" data-i18n="tasks.suggest">✨ Suggest tasks</button>
                </div>
                <div id="goal-analysis" class="goal-analysis" hidden></div>
                <form id="task-form">
                    <input type="text" id="task-title" data-i18n-placeholder="task.title" placeholder="What needs to be done?" required>
                    <button type="submit" data-i18n="task.add">Add</button>
                </form>
                <div id="task-error" class="form-error" style="display:none;"></div>
                <ul id="tasks-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const API_URL = (window.location.port === '8000') ? 'http://localhost:8000/api' : '/api';

        const translations = {
            en: {
                'page.title': 'Goals and Tasks Tracker',
                'auth.heading': '🎯 Goals Tracker',
                'auth.email': 'Email...',
                'auth.password': 'Password...',
                'auth.signIn': 'Sign In',
                'auth.signUp': 'Sign Up',
                'auth.toSignUp': 'No account? Sign Up',
                'auth.toSignIn': 'Already have an account? Sign In',
                'auth.failed': 'Authentication failed',
                'app.myGoals': '🎯 My Goals',
                'goals.empty': 'No goals yet. Create your first goal!',
                'app.signOut': 'Sign Out',
                'goal.title': 'Goal name...',
                'goal.description': 'Description...',
                'goal.add': 'Add goal',
                'placeholder.selectGoal': 'Select a goal on the left to manage its tasks.',
                'tasks.heading': '📝 Tasks',
                'tasks.headingFor': '📝 Tasks for: {title}',
                'tasks.suggest': '✨ Suggest tasks',
                'tasks.analyzing': 'Analyzing...',
                'tasks.analyzingHint': 'AI is finding practical steps...',
                'tasks.suggestedHeader': 'Suggested tasks:',
                'tasks.add': 'Add',
                'tasks.added': 'Added',
                'tasks.analyzeFailed': 'Could not analyze the goal',
                'task.title': 'What needs to be done?',
                'task.add': 'Add',
                'tasks.empty': 'No tasks yet. Add the first task!',
                'common.delete': 'Delete',
                'common.edit': 'Edit',
                'auth.emailRequired': 'Email is required.',
                'auth.passwordRequired': 'Password is required.',
                'auth.passwordShort': 'Password must be at least 6 characters.',
                'auth.signingIn': 'Signing in...',
                'auth.signingUp': 'Signing up...',
                'goal.titleRequired': 'Goal name is required.',
                'task.titleRequired': 'Task title is required.'
            },
            ru: {
                'page.title': 'Трекер целей и задач',
                'auth.heading': '🎯 Трекер целей',
                'auth.email': 'Электронная почта...',
                'auth.password': 'Пароль...',
                'auth.signIn': 'Войти',
                'auth.signUp': 'Зарегистрироваться',
                'auth.toSignUp': 'Нет аккаунта? Зарегистрироваться',
                'auth.toSignIn': 'Уже есть аккаунт? Войти',
                'auth.failed': 'Не удалось войти',
                'app.myGoals': '🎯 Мои цели',
                'app.signOut': 'Выйти',
                'goal.title': 'Название цели...',
                'goal.description': 'Описание...',
                'goal.add': 'Добавить цель',
                'placeholder.selectGoal': 'Выберите цель слева, чтобы управлять её задачами.',
                'tasks.heading': '📝 Задачи',
                'tasks.headingFor': '📝 Задачи для: {title}',
                'tasks.suggest': '✨ Предложить задачи',
                'tasks.analyzing': 'Анализ...',
                'tasks.analyzingHint': 'AI подбирает практические шаги...',
                'tasks.suggestedHeader': 'Предложенные задачи:',
                'tasks.add': 'Добавить',
                'tasks.added': 'Добавлено',
                'tasks.analyzeFailed': 'Не удалось проанализировать цель',
                'task.title': 'Что нужно сделать?',
                'task.add': 'Добавить',
                'tasks.empty': 'Пока нет задач. Добавьте первую задачу!',
                'goals.empty': 'Пока нет целей. Создайте первую цель!',
                'common.delete': 'Удалить',
                'common.edit': 'Изменить',
            }
        };

        let currentLang = 'en';
        let selectedGoalId = null;
        let selectedGoalTitleText = '';
        let authToken = null;
        let isLogin = true;
        let currentTheme = 'light';
        let editingGoalId = null;
        let editingTaskId = null;

        const themeToggleBtn = document.getElementById('theme-toggle-btn');

        // ==================== THEME ====================

        function applyTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggleBtn.innerText = theme === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
        }

        themeToggleBtn.addEventListener('click', () => {
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // Auth DOM elements
        const authScreen = document.getElementById('auth-screen');
        const appScreen = document.getElementById('app-screen');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const toggleAuthBtn = document.getElementById('toggle-auth-btn');
        const authError = document.getElementById('auth-error');
        const logoutBtn = document.getElementById('logout-btn');

        // App DOM elements
        const goalForm = document.getElementById('goal-form');
        const goalsList = document.getElementById('goals-list');
        const taskForm = document.getElementById('task-form');
        const tasksList = document.getElementById('tasks-list');
        const tasksContainer = document.getElementById('tasks-container');
        const noSelection = document.getElementById('no-selection');
        const selectedGoalTitleEl = document.getElementById('selected-goal-title');
        const analyzeGoalButton = document.getElementById('analyze-goal-button');
        const goalAnalysis = document.getElementById('goal-analysis');
        const goalError = document.getElementById('goal-error');
        const taskError = document.getElementById('task-error');
        // ==================== I18N ====================

        function t(key, params) {
            const dictionary = translations[currentLang] ?? translations.en;
            let text = dictionary[key] ?? translations.en[key] ?? key;
            if (params) {
                Object.keys(params).forEach((name) => {
                    text = text.replace(`{${name}}`, params[name]);
                });
            }
            return text;
        }

        function updateLangButtons() {
            document.querySelectorAll('.lang-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });
        }

        function renderSelectedGoalHeading() {
            selectedGoalTitleEl.innerText = selectedGoalId === null
                ? t('tasks.heading')
                : t('tasks.headingFor', { title: selectedGoalTitleText });
        }

        function applyTranslations() {
            document.documentElement.lang = currentLang;
            document.title = t('page.title');

            document.querySelectorAll('[data-i18n]').forEach((el) => {
                el.innerText = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });

            authSubmitBtn.innerText = isLogin ? t('auth.signIn') : t('auth.signUp');
            toggleAuthBtn.innerText = isLogin ? t('auth.toSignUp') : t('auth.toSignIn');

            renderSelectedGoalHeading();
            updateLangButtons();
        }

        function setLanguage(lang) {
            if (!translations[lang]) return;
            currentLang = lang;
            localStorage.setItem('lang', lang);
            applyTranslations();

            if (authToken && appScreen.style.display !== 'none') {
                fetchGoals();
                if (selectedGoalId !== null) {
                    fetchTasks(selectedGoalId);
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            currentLang = localStorage.getItem('lang') || 'en';
            applyTranslations();
            const savedTheme = localStorage.getItem('theme');
            applyTheme(savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

            document.querySelectorAll('.lang-btn').forEach((btn) => {
                btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
            });

            authToken = localStorage.getItem('token');
            if (authToken) {
                showApp();
                fetchGoals();
            } else {
                showAuth();
            }
        });

        // ==================== AUTH LOGIC ====================

        function showAuth() {
            authScreen.style.display = 'flex';
            appScreen.style.display = 'none';
            authError.style.display = 'none';
            isLogin = true;
            authSubmitBtn.innerText = t('auth.signIn');
            toggleAuthBtn.innerText = t('auth.toSignUp');
        }

        function showApp() {
            authScreen.style.display = 'none';
            appScreen.style.display = 'grid';
        }

        toggleAuthBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            authError.style.display = 'none';
            authForm.reset();
            authSubmitBtn.innerText = isLogin ? t('auth.signIn') : t('auth.signUp');
            toggleAuthBtn.innerText = isLogin ? t('auth.toSignUp') : t('auth.toSignIn');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = authEmail.value;
            const password = authPassword.value;

            authError.style.display = 'none';

            if (!email || !password) {
                authError.innerText = t('auth.emailRequired');
                authError.style.display = 'block';
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                authError.innerText = t('auth.emailInvalid');
                authError.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                authError.innerText = t('auth.passwordShort');
                authError.style.display = 'block';
                return;
            }

            authSubmitBtn.disabled = true;
            authSubmitBtn.innerText = isLogin ? t('auth.signingIn') : t('auth.signingUp');

            try {
                const endpoint = isLogin ? 'auth/login' : 'auth/register';
                const response = await fetch(`${API_URL}/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept-Language': currentLang
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || t('auth.failed'));
                }

                const data = await response.json();
                authToken = data.access_token;
                localStorage.setItem('token', authToken);
                authForm.reset();
                showApp();
                fetchGoals();
            } catch (error) {
                authError.innerText = error.message;
                authError.style.display = 'block';
            } finally {
                authSubmitBtn.disabled = false;
                authSubmitBtn.innerText = isLogin ? t('auth.signIn') : t('auth.signUp');
            }
        });

        logoutBtn.addEventListener('click', resetSession);

        function resetSession() {
            authToken = null;
            editingGoalId = null;
            editingTaskId = null;
            localStorage.removeItem('token');
            selectedGoalId = null;
            selectedGoalTitleText = '';
            goalsList.innerHTML = '';
            tasksList.innerHTML = '';
            tasksContainer.style.display = 'none';
            noSelection.style.display = 'block';
            showAuth();
        }

        // ==================== API REQUESTS ====================

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${authToken}`,
                'Accept-Language': currentLang
            };
        }

        // Wrapper that redirects to the auth screen when the session is invalid.
        async function apiFetch(path, options = {}) {
            const config = {
                method: options.method || 'GET',
                headers: getHeaders()
            };
            if (options.body !== undefined) {
                config.body = options.body;
            }

            const response = await fetch(`${API_URL}${path}`, config);
            if (response.status === 401) {
                resetSession();
                throw new Error('Unauthorized');
            }
            return response;
        }

        // Fetch goals and calculate progress
        async function fetchGoals() {
            try {
                const res = await apiFetch('/goals');
                if (!res.ok) throw new Error('Failed to fetch goals');

                const goals = await res.json();
                goalsList.innerHTML = '';

                if (goals.length === 0) {
                    goalsList.innerHTML = `<div class="empty-state">${t('goals.empty')}</div>`;
                }

                goals.forEach(goal => {
                    const totalTasks = goal.tasks?.length ?? 0;
                    const completedTasks = goal.tasks?.filter(t => t.is_completed).length ?? 0;
                    const progressPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

                    const goalEl = document.createElement('div');
                    goalEl.className = `goal-item ${selectedGoalId === goal.id ? 'active' : ''}`;

                    const goalRow = document.createElement('div');
                    goalRow.className = 'goal-row';

                    const goalMain = document.createElement('div');
                    goalMain.className = 'goal-main';
                    goalMain.dataset.goalId = goal.id;

                    const goalTitleEl = document.createElement('h3');
                    goalTitleEl.textContent = goal.title;

                    const goalDescriptionEl = document.createElement('p');
                    goalDescriptionEl.textContent = goal.description || '';

                    const progressContainer = document.createElement('div');
                    progressContainer.className = 'progress-container';

                    const progressBar = document.createElement('div');
                    progressBar.className = 'progress-bar';
                    progressBar.style.width = `${progressPercent}%`;
                    progressContainer.appendChild(progressBar);

                    const progressText = document.createElement('span');
                    progressText.className = 'progress-text';
                    progressText.textContent = `${progressPercent}% (${completedTasks}/${totalTasks})`;

                    goalMain.append(
                        goalTitleEl,
                        goalDescriptionEl,
                        progressContainer,
                        progressText
                    );

                    const editBtn = document.createElement('button');
                    editBtn.type = 'button';
                    editBtn.className = 'edit-btn';
                    editBtn.dataset.goalId = goal.id;
                    editBtn.textContent = t('common.edit');

                    const deleteBtn = document.createElement('button');
                    deleteBtn.type = 'button';
                    deleteBtn.className = 'delete-btn danger-btn';
                    deleteBtn.dataset.goalId = goal.id;
                    deleteBtn.textContent = t('common.delete');

                    goalRow.append(goalMain, editBtn, deleteBtn);
                    goalEl.appendChild(goalRow);

                    goalMain.addEventListener('click', () => selectGoal(goal));

                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteGoal(goal.id);
                    });

                    editBtn.addEventListener('click', () => {
                        editingGoalId = goal.id;
                        document.getElementById('goal-title').value = goal.title;
                        document.getElementById('goal-desc').value = goal.description || '';
                        goalError.style.display = 'none';
                    });

                    goalsList.appendChild(goalEl);
                });
            } catch (error) {
                console.error('Error fetching goals:', error);
            }
        }
        // Create a goal
        goalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('goal-title').value;
            const description = document.getElementById('goal-desc').value;

            if (!title || !title.trim()) {
                goalError.innerText = t('goal.titleRequired');
                goalError.style.display = 'block';
                return;
            }

            goalError.style.display = 'none';

            try {
                const method = editingGoalId ? 'PUT' : 'POST';
                const url = editingGoalId ? '/goals/' + editingGoalId : '/goals';
                await apiFetch(url, {
                    method,
                    body: JSON.stringify({ title, description })
                });

                goalForm.reset();
                editingGoalId = null;
                fetchGoals();
            } catch (error) {
                console.error('Error creating goal:', error);
            }
        });

        // Select a goal
        function selectGoal(goal) {
            selectedGoalId = goal.id;
            selectedGoalTitleText = goal.title;
            renderSelectedGoalHeading();

            document.querySelectorAll('.goal-item').forEach(el => el.classList.remove('active'));
            fetchGoals();

            noSelection.style.display = 'none';
            tasksContainer.style.display = 'block';
            goalAnalysis.hidden = true;
            goalAnalysis.innerHTML = '';
            fetchTasks(goal.id);
        }

        analyzeGoalButton.addEventListener('click', async () => {
            if (selectedGoalId === null) return;

            analyzeGoalButton.disabled = true;
            analyzeGoalButton.innerText = t('tasks.analyzing');
            goalAnalysis.hidden = false;
            goalAnalysis.innerText = t('tasks.analyzingHint');

            try {
                const response = await apiFetch(`/goals/${selectedGoalId}/analyze`, {
                    method: 'POST'
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || t('tasks.analyzeFailed'));
                }

                const analysisText = document.createElement('strong');
                analysisText.textContent = result.analysis;

                const suggestedHeader = document.createElement('p');
                suggestedHeader.textContent = t('tasks.suggestedHeader');

                const taskList = document.createElement('ul');
                taskList.className = 'suggested-tasks';

                goalAnalysis.replaceChildren(analysisText, suggestedHeader, taskList);
                result.proposed_tasks.forEach(taskTitle => {
                    const item = document.createElement('li');
                    const text = document.createElement('span');
                    text.innerText = taskTitle;
                    const addButton = document.createElement('button');
                    addButton.type = 'button';
                    addButton.innerText = t('tasks.add');
                    addButton.addEventListener('click', async () => {
                        await apiFetch(`/goals/${selectedGoalId}/tasks`, {
                            method: 'POST',
                            body: JSON.stringify({ title: taskTitle })
                        });
                        addButton.disabled = true;
                        addButton.innerText = t('tasks.added');
                        fetchTasks(selectedGoalId);
                        fetchGoals();
                    });
                    item.appendChild(text);
                    item.appendChild(addButton);
                    taskList.appendChild(item);
                });
            } catch (error) {
                goalAnalysis.innerText = error.message;
            } finally {
                analyzeGoalButton.disabled = false;
                analyzeGoalButton.innerText = t('tasks.suggest');
            }
        });

        // Fetch tasks for the selected goal
        async function fetchTasks(goalId) {
            try {
                const res = await apiFetch(`/goals/${goalId}/tasks`);
                if (!res.ok) throw new Error('Failed to fetch tasks');

                const tasks = await res.json();
                tasksList.innerHTML = '';

                if (tasks.length === 0) {
                    tasksList.innerHTML = `<div class="empty-state">${t('tasks.empty')}</div>`;
                }

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = task.is_completed;
                    checkbox.addEventListener('change', () => toggleTask(task));

                    let titleEl;
                    if (task.id === editingTaskId) {
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'task-edit-input';
                        input.value = task.title;
                        let committed = false;
                        const commit = async () => {
                            if (committed) return;
                            committed = true;
                            const value = input.value;
                            if (value && value.trim()) {
                                editingTaskId = null;
                                await apiFetch('/tasks/' + task.id, {
                                    method: 'PATCH',
                                    body: JSON.stringify({ title: value })
                                });
                                fetchTasks(selectedGoalId);
                                fetchGoals();
                            } else {
                                input.value = task.title;
                            }
                        };
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') commit();
                        });
                        input.addEventListener('blur', commit);
                        titleEl = input;
                    } else {
                        const span = document.createElement('span');
                        span.innerText = task.title;
                        if (task.is_completed) span.className = 'completed';
                        titleEl = span;
                    }

                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'delete-btn task-delete-btn';
                    deleteButton.innerText = t('common.delete');
                    const editButton = document.createElement('button');
                    editButton.type = 'button';
                    editButton.className = 'edit-btn task-edit-btn';
                    editButton.innerText = t('common.edit');
                    editButton.addEventListener('click', () => {
                        editingTaskId = task.id;
                        fetchTasks(selectedGoalId);
                    });

                    deleteButton.addEventListener('click', () => deleteTask(task.id));

                    li.appendChild(checkbox);
                    li.appendChild(titleEl);
                    li.appendChild(deleteButton);
                    tasksList.appendChild(li);
                });
            } catch (error) {
                console.error('Error fetching tasks:', error);
            }
        }

        // Create a task
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value;

            if (!title || !title.trim()) {
                taskError.innerText = t('task.titleRequired');
                taskError.style.display = 'block';
                return;
            }

            taskError.style.display = 'none';

            try {
                await apiFetch(`/goals/${selectedGoalId}/tasks`, {
                    method: 'POST',
                    body: JSON.stringify({ title })
                });

                document.getElementById('task-title').value = '';
                fetchTasks(selectedGoalId);
                fetchGoals();
            } catch (error) {
                console.error('Error creating task:', error);
            }
        });

        async function deleteGoal(goalId) {
            try {
                await apiFetch(`/goals/${goalId}`, {
                    method: 'DELETE'
                });

                if (selectedGoalId === goalId) {
                    selectedGoalId = null;
                    editingGoalId = null;
                    selectedGoalTitleText = '';
                    renderSelectedGoalHeading();
                    tasksContainer.style.display = 'none';
                    noSelection.style.display = 'block';
                }

                fetchGoals();
                if (selectedGoalId === null) {
                    tasksList.innerHTML = '';
                }
            } catch (error) {
                console.error('Error deleting goal:', error);
            }
        }

        async function deleteTask(taskId) {
            try {
                await apiFetch(`/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                fetchTasks(selectedGoalId);
                fetchGoals();
            } catch (error) {
                console.error('Error deleting task:', error);
            }
        }

        // Toggle task status
        async function toggleTask(task) {
            try {
                await apiFetch(`/tasks/${task.id}`, {
                    method: 'PATCH',
                    body: JSON.stringify({ is_completed: !task.is_completed })
                });
                fetchTasks(selectedGoalId);
                fetchGoals();
            } catch (error) {
                console.error('Error updating task:', error);
            }
        }
    </script>
</body>
</html>
