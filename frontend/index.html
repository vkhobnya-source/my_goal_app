<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Целей и Задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="auth-view" class="auth-view">
        <div class="auth-card">
            <h1>🎯 Мои цели</h1>
            <p id="auth-description">Войдите, чтобы продолжить.</p>
            <form id="auth-form">
                <input type="email" id="auth-email" placeholder="Электронная почта" autocomplete="email" required>
                <input type="password" id="auth-password" placeholder="Пароль" autocomplete="current-password" minlength="1" maxlength="128" required>
                <p id="auth-message" class="auth-message" role="alert" hidden></p>
                <button type="submit" id="auth-submit">Войти</button>
                <button type="button" id="auth-mode-toggle" class="auth-mode-toggle">Создать аккаунт</button>
            </form>
        </div>
    </section>

    <div id="app-view" hidden>
        <header class="app-header">
            <strong>Трекер целей и задач</strong>
            <div class="account-controls">
                <span id="user-email"></span>
                <button type="button" id="logout-button">Выйти</button>
            </div>
        </header>

    <div class="container">
        <!-- Левая панель: Цели -->
        <div class="sidebar">
            <h2>🎯 Мои Цели</h2>
            <form id="goal-form">
                <input type="text" id="goal-title" placeholder="Название цели..." required>
                <textarea id="goal-desc" placeholder="Описание..."></textarea>
                <button type="submit">Добавить цель</button>
            </form>
            <div id="goals-list" class="goals-list"></div>
        </div>

        <!-- Правая панель: Задачи -->
        <div class="main-content">
            <div id="no-selection" class="placeholder">
                <h3>Выберите цель слева, чтобы управлять её задачами.</h3>
            </div>
            <div id="tasks-container" class="tasks-container" style="display: none;">
                <div class="tasks-header">
                    <h2 id="selected-goal-title">📝 Задачи</h2>
                    <button type="button" id="analyze-goal-button">✨ Предложить задачи</button>
                </div>
                <div id="goal-analysis" class="goal-analysis" hidden></div>
                <form id="task-form">
                    <input type="text" id="task-title" placeholder="Что нужно сделать?" required>
                    <button type="submit">Добавить</button>
                </form>
                <ul id="tasks-list"></ul>
            </div>
        </div>
    </div>
    </div>

    <script>
       // Самый надежный способ: если мы открыты в Docker-контейнере тестера или на порту 80,
// используем прокси /api, иначе стучимся на стандартный порт FastAPI 8000
    const API_URL = (window.location.port === '8000') ? 'http://localhost:8000/api' : '/api';


        let selectedGoalId = null;

        // Элементы DOM
        const goalForm = document.getElementById('goal-form');
        const goalsList = document.getElementById('goals-list');
        const taskForm = document.getElementById('task-form');
        const tasksList = document.getElementById('tasks-list');
        const tasksContainer = document.getElementById('tasks-container');
        const noSelection = document.getElementById('no-selection');
        const selectedGoalTitle = document.getElementById('selected-goal-title');
        const analyzeGoalButton = document.getElementById('analyze-goal-button');
        const goalAnalysis = document.getElementById('goal-analysis');
        const authView = document.getElementById('auth-view');
        const appView = document.getElementById('app-view');
        const authForm = document.getElementById('auth-form');
        const authMessage = document.getElementById('auth-message');
        const authModeToggle = document.getElementById('auth-mode-toggle');
        let authMode = 'login';

        document.addEventListener('DOMContentLoaded', initializeAuth);

        async function initializeAuth() {
            try {
                const response = await fetch(`${API_URL}/auth/me`);
                if (!response.ok) {
                    if (response.status !== 401) {
                        throw new Error('Не удалось подключиться к серверу.');
                    }
                    return;
                }
                showAuthenticatedApp(await response.json());
            } catch (error) {
                authMessage.hidden = false;
                authMessage.innerText = error.message;
            }
        }

        function showAuthenticatedApp(user) {
            authView.hidden = true;
            appView.hidden = false;
            document.getElementById('user-email').innerText = user.email;
            fetchGoals();
        }

        authModeToggle.addEventListener('click', () => {
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('auth-description').innerText =
                authMode === 'login' ? 'Войдите, чтобы продолжить.' : 'Создайте аккаунт для своих целей.';
            document.getElementById('auth-submit').innerText =
                authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
            authModeToggle.innerText =
                authMode === 'login' ? 'Создать аккаунт' : 'У меня уже есть аккаунт';
            document.getElementById('auth-password').autocomplete =
                authMode === 'login' ? 'current-password' : 'new-password';
            document.getElementById('auth-password').minLength =
                authMode === 'login' ? 1 : 8;
            document.getElementById('auth-password').placeholder =
                authMode === 'login' ? 'Пароль' : 'Пароль (не менее 8 символов)';
            authMessage.hidden = true;
        });

        authForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            authMessage.hidden = true;
            const submitButton = document.getElementById('auth-submit');
            submitButton.disabled = true;
            try {
                const response = await fetch(`${API_URL}/auth/${authMode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('auth-email').value,
                        password: document.getElementById('auth-password').value
                    })
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || 'Не удалось выполнить вход.');
                }
                authForm.reset();
                showAuthenticatedApp(result);
            } catch (error) {
                authMessage.hidden = false;
                authMessage.innerText = error.message;
            } finally {
                submitButton.disabled = false;
            }
        });

        document.getElementById('logout-button').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_URL}/auth/logout`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error('Не удалось выйти из аккаунта.');
                }
                selectedGoalId = null;
                tasksList.innerHTML = '';
                appView.hidden = true;
                authView.hidden = false;
            } catch (error) {
                window.alert(error.message);
            }
        });

        // Получение целей
        // Получение целей и расчет прогресса
async function fetchGoals() {
    const res = await fetch(`${API_URL}/goals`);
    const goals = await res.json();
    goalsList.innerHTML = '';

    goals.forEach(goal => {
        // Вычисляем процент выполнения задач внутри цели
        const totalTasks = goal.tasks ? goal.tasks.length : 0;
        const completedTasks = goal.tasks ? goal.tasks.filter(t => t.is_completed).length : 0;
        const progressPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

        const goalEl = document.createElement('div');
        goalEl.className = `goal-item ${selectedGoalId === goal.id ? 'active' : ''}`;

    goalEl.innerHTML = `
        <div class="goal-row">
            <div class="goal-main" data-goal-id="${goal.id}">
                <h3>${goal.title}</h3>
                <p>${goal.description || ''}</p>
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${progressPercent}%"></div>
                </div>
                <span class="progress-text">${progressPercent}% (${completedTasks}/${totalTasks})</span>
            </div>
            <button type="button" class="delete-btn danger-btn" data-goal-id="${goal.id}">Удалить</button>
        </div>
    `;

    const goalMain = goalEl.querySelector('.goal-main');
    goalMain.addEventListener('click', () => selectGoal(goal));

    const deleteBtn = goalEl.querySelector('.delete-btn');
    deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteGoal(goal.id);
    });

    goalsList.appendChild(goalEl);
    });
}


        // Создание цели
        goalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('goal-title').value;
            const description = document.getElementById('goal-desc').value;

            await fetch(`${API_URL}/goals`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, description })
            });

            goalForm.reset();
            fetchGoals();
        });

        // Выбор цели
        function selectGoal(goal) {
            selectedGoalId = goal.id;
            selectedGoalTitle.innerText = `📝 Задачи для: ${goal.title}`;

            // Подсветка активной цели
            document.querySelectorAll('.goal-item').forEach(el => el.classList.remove('active'));
            fetchGoals(); // Перерисует с активным классом

            noSelection.style.display = 'none';
            tasksContainer.style.display = 'block';
            goalAnalysis.hidden = true;
            goalAnalysis.innerHTML = '';
            fetchTasks(goal.id);
        }

        analyzeGoalButton.addEventListener('click', async () => {
            if (selectedGoalId === null) return;

            analyzeGoalButton.disabled = true;
            analyzeGoalButton.innerText = 'Анализирую...';
            goalAnalysis.hidden = false;
            goalAnalysis.innerText = 'AI подбирает практические шаги...';

            try {
                const response = await fetch(`${API_URL}/goals/${selectedGoalId}/analyze`, {
                    method: 'POST'
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || 'Не удалось проанализировать цель');
                }

                goalAnalysis.innerHTML = `
                    <strong>${result.analysis}</strong>
                    <p>Предлагаемые задачи:</p>
                    <ul class="suggested-tasks"></ul>
                `;
                const taskList = goalAnalysis.querySelector('.suggested-tasks');
                result.proposed_tasks.forEach(taskTitle => {
                    const item = document.createElement('li');
                    const text = document.createElement('span');
                    text.innerText = taskTitle;
                    const addButton = document.createElement('button');
                    addButton.type = 'button';
                    addButton.innerText = 'Добавить';
                    addButton.addEventListener('click', async () => {
                        await fetch(`${API_URL}/goals/${selectedGoalId}/tasks`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ title: taskTitle })
                        });
                        addButton.disabled = true;
                        addButton.innerText = 'Добавлено';
                        fetchTasks(selectedGoalId);
                        fetchGoals();
                    });
                    item.appendChild(text);
                    item.appendChild(addButton);
                    taskList.appendChild(item);
                });
            } catch (error) {
                goalAnalysis.innerText = error.message;
            } finally {
                analyzeGoalButton.disabled = false;
                analyzeGoalButton.innerText = '✨ Предложить задачи';
            }
        });

        // Получение задач для выбранной цели
        async function fetchTasks(goalId) {
            const res = await fetch(`${API_URL}/goals/${goalId}/tasks`);
            const tasks = await res.json();
            tasksList.innerHTML = '';

            tasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'task-item';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.is_completed;
                checkbox.addEventListener('change', () => toggleTask(task));

                const span = document.createElement('span');
                span.innerText = task.title;
                if (task.is_completed) span.className = 'completed';

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'delete-btn task-delete-btn';
                deleteButton.innerText = 'Удалить';
                deleteButton.addEventListener('click', () => deleteTask(task.id));

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteButton);
                tasksList.appendChild(li);
            });
        }

        // Создание задачи
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('task-title').value;

            await fetch(`${API_URL}/goals/${selectedGoalId}/tasks`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            });

            document.getElementById('task-title').value = '';
            fetchTasks(selectedGoalId);
            fetchGoals(); // Перерисовываем прогресс слева
        });

        async function deleteGoal(goalId) {
            await fetch(`${API_URL}/goals/${goalId}`, {
                method: 'DELETE'
            });

            if (selectedGoalId === goalId) {
                selectedGoalId = null;
                tasksContainer.style.display = 'none';
                noSelection.style.display = 'block';
            }

            fetchGoals();
            if (selectedGoalId === null) {
                tasksList.innerHTML = '';
            }
        }

        async function deleteTask(taskId) {
            await fetch(`${API_URL}/tasks/${taskId}`, {
                method: 'DELETE'
            });

            fetchTasks(selectedGoalId);
            fetchGoals();
        }

        // Переключение статуса задачи
        async function toggleTask(task) {
            await fetch(`${API_URL}/tasks/${task.id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_completed: !task.is_completed })
            });
            fetchTasks(selectedGoalId);
            fetchGoals(); // Перерисовываем прогресс слева
        }
    </script>
</body>
</html>
