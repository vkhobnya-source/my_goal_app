services:
  db-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goals"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goals_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goals_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db-prod:5432/goals
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-My Goal App}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      db-prod:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_prod_data:
  postgres_test_data: