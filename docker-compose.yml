services:
  db-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goals"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: goals_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goals_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always

  backup-prod-db:
    image: postgres:16-alpine
    environment:
      PGHOST: db-prod
      PGPORT: 5432
      PGDATABASE: goals
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres_backup_data:/backups
      - ./backup/backup-prod-db.sh:/usr/local/bin/backup-prod-db.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-prod-db.sh"]
    depends_on:
      db-prod:
        condition: service_healthy
    restart: always

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db-prod:5432/goals
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4.1-flash}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-My Goal App}
    depends_on:
      db-prod:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_prod_data:
  postgres_test_data:
  postgres_backup_data: